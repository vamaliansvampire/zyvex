name: Build ZYVEX AI Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify Java and Environment
        run: |
          echo "=== Java Environment Diagnostics ==="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ] || [ ! -d "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set or directory does not exist." >&2
            exit 1
          fi

          # Extract and verify Java major version
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | sed -E 's/.*version "([0-9]+).*/\1/')
          echo "Detected Java Major Version: $JAVA_MAJOR"
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java 17 or higher is required. Found: $JAVA_MAJOR" >&2
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Project Secrets & Config
        run: |
          echo "=== Verifying Project Configuration ==="
          # Ensure .env or .env.example is present for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              echo "Creating .env from .env.example..."
              cp .env.example .env
            else
              echo "Creating default .env placeholder..."
              echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
            fi
          fi

      - name: Prepare Debug Keystore
        run: |
          echo "=== Verifying Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore is already present."
          elif [ -f "./debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -s "./debug.keystore" ]; then
            echo "ERROR: debug.keystore is missing or empty." >&2
            exit 1
          fi
          echo "debug.keystore verified successfully."

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper is ready."
          else
            echo "ERROR: gradlew not found in repository root." >&2
            exit 1
          fi

      - name: Build Debug APK with Gradle
        run: |
          echo "=== Executing assembleDebug ==="
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and Stage APK
        id: verify_apk
        run: |
          echo "=== Verifying Built APK ==="
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          TARGET_APK="ZYVEX-AI-debug.apk"

          if [ ! -f "$ORIGINAL_APK" ]; then
            echo "ERROR: Expected output APK not found at $ORIGINAL_APK" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered files in app/build/outputs/apk:"
              find app/build/outputs/apk -type f
            fi
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$ORIGINAL_APK" 2>/dev/null || stat -f%z "$ORIGINAL_APK" 2>/dev/null || wc -c < "$ORIGINAL_APK")
          if [ "$APK_SIZE" -le 1000 ]; then
            echo "ERROR: Generated APK is unexpectedly small or empty: $APK_SIZE bytes" >&2
            exit 1
          fi

          # Stage friendly named APK for release & artifact download
          cp "$ORIGINAL_APK" "$TARGET_APK"
          
          echo "APK successfully verified and staged:"
          ls -lh "$TARGET_APK"
          
          echo "apk_path=$TARGET_APK" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZYVEX-AI-debug-apk
          path: ZYVEX-AI-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate Build Summary
        if: always()
        run: |
          if [ -f "ZYVEX-AI-debug.apk" ]; then
            APK_SIZE_HUMAN=$(ls -lh ZYVEX-AI-debug.apk | awk '{print $5}')
            echo "## ⚡ ZYVEX AI - Build Succeeded!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact Name:** \`ZYVEX-AI-debug-apk\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Binary Output:** \`ZYVEX-AI-debug.apk\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Size:** $APK_SIZE_HUMAN" >> $GITHUB_STEP_SUMMARY
            echo "- **Build Trigger:** \`${{ github.event_name }}\` on commit \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📲 How to Download on your Mobile Device" >> $GITHUB_STEP_SUMMARY
            echo "1. On this workflow run page, scroll to the **Artifacts** section at the bottom." >> $GITHUB_STEP_SUMMARY
            echo "2. Download **\`ZYVEX-AI-debug-apk\`** directly to your device." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ ZYVEX AI - Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "Please inspect the build logs above for compilation or environment diagnostics." >> $GITHUB_STEP_SUMMARY
          fi
