name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ] || [ ! -d "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set or directory does not exist." >&2
            exit 1
          fi

          JAVA_RAW_VERSION=$(java -version 2>&1 | head -n 1)
          echo "Detected raw version string: $JAVA_RAW_VERSION"
          
          # Extract major version number
          MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          
          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Unable to detect Java major version from '$JAVA_RAW_VERSION'." >&2
            exit 1
          fi

          echo "Detected Java Major Version: $MAJOR_VERSION"

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or higher (detected: $MAJOR_VERSION)." >&2
            exit 1
          fi

          echo "Java environment verified successfully: Java $MAJOR_VERSION meets or exceeds required version 17."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Debug Keystore Setup ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root. Generation skipped."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore." >&2
              exit 1
            fi

            if [ ! -s "./debug.keystore" ]; then
              echo "ERROR: Generated ./debug.keystore is empty." >&2
              exit 1
            fi

            echo "Temporary debug keystore generated successfully."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "Checking expected debug APK path: $EXPECTED_APK"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at: $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk for any discovered APKs..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK exists but is empty (0 bytes)." >&2
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "ERROR: $EXPECTED_APK does not have .apk extension." >&2
            exit 1
          fi

          echo "APK verification passed:"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          # Create a temporary directory outside repository
          TMP_DIR=$(mktemp -d "${RUNNER_TEMP}/apk-release-asset-XXXXXX")
          
          # Sanitize repository name
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_-' | sed 's/^[-_]*//;s/[-_]*$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DEST_PATH="${TMP_DIR}/${ASSET_FILENAME}"

          echo "Copying APK to temporary release directory..."
          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $DEST_PATH" >&2
            exit 1
          fi

          echo "Prepared release asset: $DEST_PATH ($(wc -c < "$DEST_PATH") bytes)"
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub Release Preparation ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing, invalid, or empty: $ASSET_PATH" >&2
            exit 1
          fi

          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Release asset does not have .apk extension: $ASSET_PATH" >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          echo "Creating GitHub Release with tag: $RELEASE_TAG"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "### ZYVEX AI - Debug APK Build
This is an automatically generated debug APK.
- **Built by:** GitHub Actions
- **Run number:** ${GITHUB_RUN_NUMBER}
- **Run attempt:** ${GITHUB_RUN_ATTEMPT}
- **Commit:** ${GITHUB_SHA}
- **Asset:** \`${ASSET_NAME}\`

> **Notice:** This APK is intended for testing and debugging purposes. It is signed only with a temporary debug keystore and is not a Play Store production release."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_STATUS="${{ steps.create_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          echo "=== APK Release & Download Summary ==="
          echo "Release creation outcome: $RELEASE_STATUS"

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            
            RELEASE_URL=""
            if command -v gh >/dev/null 2>&1; then
              gh release view "$RELEASE_TAG" --json tagName,title,url || true
              RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            else
              RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            fi

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Succeeded!

          - **Release Tag:** \`${RELEASE_TAG}\`
          - **APK Asset Filename:** \`${ASSET_NAME}\`
          - **Direct Release Page:** [View GitHub Release](${RELEASE_URL})

          ### 📲 How to Download & Install
          1. Open the [Release Page](${RELEASE_URL}) directly on your Android device.
          2. Scroll down to the **Assets** section.
          3. Tap on **\`${ASSET_NAME}\`** to download and install the debug APK.

          > 💾 **Backup:** The standard GitHub Actions artifact **\`app-debug-apk\`** is also available under the workflow run summary.
          EOF
          else
            echo "WARNING: GitHub Release publishing failed or was skipped." >&2
            echo "The debug APK build succeeded, and the Actions artifact named 'app-debug-apk' remains available."

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Build Succeeded (Release Publishing Warning)

          - **Build Status:** APK compiled and verified successfully.
          - **Actions Artifact:** The artifact named **\`app-debug-apk\`** is available for download at the top/bottom of this GitHub Actions run page.
          - **Notice:** Automatic publishing to GitHub Releases encountered an issue, but the completed debug APK was safely preserved as an Actions artifact.
          EOF
          fi
